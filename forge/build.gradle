plugins {
    id "java"
    id "net.minecraftforge.gradle"
}
def mc = rootProject.minecraftVersion
def loader = rootProject.targetVersion.forge
if (loader == null) { throw new GradleException("Forge is not published for Minecraft ${mc}.") }
apply from: rootProject.file("gradle/minecraft-module.gradle")
minecraft {
    if (rootProject.targetVersion.java == 21) { mappings channel: 'official', version: mc }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}
dependencies { implementation minecraft.dependency("net.minecraftforge:forge:${mc}-${loader}") }
sourceSets.main.java.srcDir "src/${(loader.tokenize('.')[0] as int) >= 56 ? 'modern' : 'legacy'}/java"
