pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = "Fabric"
            url = uri("https://maven.fabricmc.net/")
        }
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = "SpigotMC"
            url = uri("https://hub.spigotmc.org/nexus/content/repositories/snapshots/")
        }
        maven {
            name = "CodeMC"
            url = uri("https://repo.codemc.io/repository/maven-public/")
        }
        maven {
            name = "Mojang"
            url = uri("https://libraries.minecraft.net/")
        }
        maven {
            name = "Fabric"
            url = uri("https://maven.fabricmc.net/")
        }
        maven {
            name = "Forge"
            url = uri("https://maven.minecraftforge.net/")
        }
    }
}

rootProject.name = "Simple-Kill-Command"

include("common")
def platform = providers.gradleProperty("platform").getOrElse("all")
if (!(platform in ["all", "bukkit", "fabric", "forge", "neoforge"])) {
    throw new GradleException("Unknown platform: ${platform}")
}
def mc = providers.gradleProperty("minecraftVersion").get()
def matrix = new groovy.json.JsonSlurper().parse(file("gradle/minecraft-versions.json"))
["bukkit", "fabric", "forge", "neoforge"].findAll {
    (platform == "all" || platform == it) && !(platform == "all" && it == "forge" && matrix[mc]?.forge == null)
}.each { include(it) }
