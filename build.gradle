plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.18.2" apply false
    id "net.fabricmc.fabric-loom" version "1.18.2" apply false
    id "net.minecraftforge.gradle" version "7.0.40" apply false
    id "net.neoforged.moddev" version "2.0.148" apply false
}

ext.supportedVersions = new groovy.json.JsonSlurper().parse(file("gradle/minecraft-versions.json"))
ext.minecraftVersion = providers.gradleProperty("minecraftVersion").get()
ext.targetVersion = supportedVersions[minecraftVersion]
if (targetVersion == null) { throw new GradleException("Unsupported Minecraft version: ${minecraftVersion}") }
ext.serverTest = providers.gradleProperty("serverTest").map { it.toBoolean() }.getOrElse(false)

allprojects {
    group = "com.simplekillcommand"
    version = providers.gradleProperty("projectVersion").get()
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = "UTF-8"
            options.release = 17
        }
    }
}
